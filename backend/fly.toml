# fly.toml — Cehta Capital Backend
# Deploy: fly deploy (from backend/)
# First time: fly launch --no-deploy, then set secrets, then fly deploy

app = "cehta-backend"
primary_region = "gru"       # São Paulo — más cercano a Chile
kill_signal = "SIGTERM"      # graceful shutdown — uvicorn cierra conexiones limpio
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

# Cada deploy aplica migraciones automáticamente antes de cambiar el tráfico.
# V5++ ola BS HOTFIX: release_command DESACTIVADO.
#
# Razón: Supabase session pooler (port 5432) tiene límite estricto de
# 15 clientes simultáneos en Free tier. La app vieja en proceso de
# rolling deploy mantiene su pool ocupado, dejando 0 espacio para que
# alembic abra una conn nueva durante el release. Esto rompe el deploy
# aunque no haya migraciones que aplicar.
#
# Workaround: corremos alembic MANUALMENTE cuando hay migraciones nuevas:
#   fly ssh console -a cehta-backend
#   alembic upgrade head
#
# Cuando se quiera re-habilitar (ej. migrando a transaction pooler para
# release_command), descomentar las 2 líneas siguientes:
# [deploy]
#   release_command = "alembic upgrade head"

[env]
  APP_ENV = "production"
  LOG_LEVEL = "INFO"
  PORT = "8000"

# Procesos:
#   app      — API web (uvicorn).
#   etl_cron — runner ETL standalone. Schedule: hourly (configurado 2026-05-04
#              via `fly machine update <id> --schedule hourly`). La machine
#              despierta cada hora, sincroniza Dropbox, y se apaga.
#   Cambiar cadencia: `fly machine update <id> --schedule daily|hourly|monthly`
#              o cron: `fly machine update <id> --schedule "*/30 * * * *"`.
#   Ver: https://fly.io/docs/machines/runtime/scheduling/
[processes]
  # uvicorn flags V5++ perf:
  #   --workers 1: Round 109 — bajado de 2 a 1 para no duplicar el pool DB.
  #                Cada worker abre su propio pool (3+1=4 conns), con 2 workers
  #                = 8 conns solo de API, saturando los 15 del session pooler
  #                Free tier cuando hay crons concurrentes. Con 1 worker = 4 conns.
  #                Trade-off: menos paralelismo CPU-bound, pero la app es 99%
  #                async I/O bound, así que el impacto es mínimo.
  #   --timeout-keep-alive 75: reusa connections HTTP de browsers idle (default 5s)
  #   --limit-concurrency 50: cap defensivo si un endpoint se cuelga
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --timeout-keep-alive 75 --limit-concurrency 50"
  etl_cron = "python -m scripts.etl_cron"
  alerts_cron = "python -m scripts.alerts_cron"
  # Inbox poll de contactocehta@gmail.com — cada 15min.
  # Configurar schedule: `fly machine update <id> --schedule "*/15 * * * *"`
  # Sin INBOX_IMAP_USER/PASSWORD, soft-fails y termina exit 0.
  inbox_cron = "python -m scripts.inbox_cron"
  # Backup DB diario → Dropbox /99-Backups/. V5++.
  # Configurar schedule: `fly machine update <id> --schedule daily`
  backup_cron = "python -m scripts.backup_db"
  # Verify backup integrity weekly. V5++ ola X.
  # Configurar schedule: `fly machine update <id> --schedule weekly`
  # Si pg_restore --list falla, exit != 0 alerta vía Sentry/cron.
  verify_backup_cron = "python -m scripts.verify_backup"
  # V5++ ola AJ: limpieza weekly de audit.http_mutations > 90 días.
  # Configurar: `fly machine update <id> --schedule weekly`
  # Tunable: env var AUDIT_RETENTION_DAYS (default 90).
  audit_retention_cron = "python -m scripts.audit_retention_cleanup"
  # Round 126 — Monitor de salud cada 10 min.
  # Cron suggested: */10 * * * *
  # Lee /health + métricas DB, inserta en core.system_health_checks,
  # abre incidente en core.system_incidents si detecta anomalía.
  # NO modifica código ni emite documentos.
  monitor_cron = "python -m scripts.monitor_cron"
  # Round 126 — Auto-sync diario de data externa SII + Nubox.
  # Cron suggested: 0 6 * * *  (06:00 GMT = 03:00 CL)
  # Para cada empresa con credencial validada: trae RCV del mes anterior
  # + ejecuta conciliación. NO emite vouchers, solo data flow.
  auto_sync_cron = "python -m scripts.auto_sync_cron"

[http_service]
  internal_port = 8000
  force_https = true
  # V5++ perf: NUNCA dormir la app. Cold start de Python+SQLAlchemy es ~6-8s.
  # Costo: ~$5 USD/mes adicional (VM idle), pero elimina el "se pega" del
  # primer click después de inactividad.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
  # Concurrency tuning: hard limit + soft warning para evitar overload.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 80
    hard_limit = 120

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Secrets (configurar con: fly secrets set KEY=value)
# DATABASE_URL
# ALEMBIC_DATABASE_URL
# SUPABASE_URL
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY
# SUPABASE_JWT_SECRET
# SECRET_KEY
# CORS_ORIGINS  (e.g. https://cehta.vercel.app)
# ANTHROPIC_API_KEY   (opcional — habilita AI chat + inbox classifier)
# RESEND_API_KEY      (opcional — habilita envío de emails outbound)
# DROPBOX_REFRESH_TOKEN  (opcional — habilita sync Dropbox + inbox attachments)
# INBOX_IMAP_USER     (ej: contactocehta@gmail.com)
# INBOX_IMAP_PASSWORD (Gmail App Password 16 chars — NO la del usuario humano)
